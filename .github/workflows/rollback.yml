name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Helm revision to rollback to (leave empty for previous)'
        required: false
        default: ''

jobs:
  rollback:
    name: Rollback Helm Release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Show Helm history
        run: helm history school-erp -n school-erp

      - name: Rollback
        run: |
          if [ -n "${{ github.event.inputs.revision }}" ]; then
            helm rollback school-erp ${{ github.event.inputs.revision }} -n school-erp --wait --timeout 5m
          else
            helm rollback school-erp -n school-erp --wait --timeout 5m
          fi

      - name: Verify rollback
        run: kubectl rollout status deployment/api-gateway -n school-erp --timeout=3m
