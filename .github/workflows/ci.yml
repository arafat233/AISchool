name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.33.0"
  PYTHON_VERSION: "3.11"

jobs:
  # ─── Lint & Type-check ──────────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

  # ─── Unit & Integration Tests ───────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: school_erp_test
          POSTGRES_USER: school_erp
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://school_erp:test_password@localhost:5432/school_erp_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test_access_secret_ci
      JWT_REFRESH_SECRET: test_refresh_secret_ci
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run migrations
        run: pnpm --filter @school-erp/database db:migrate:deploy

      - name: Run unit tests
        run: pnpm test

      - name: Run E2E tests
        run: pnpm --filter @school-erp/auth-service test:e2e
        env:
          DATABASE_URL: postgresql://school_erp:test_password@localhost:5432/school_erp_test
          REDIS_URL: redis://localhost:6379
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          JWT_ACCESS_SECRET: test_access_secret_at_least_32_chars_ci
          JWT_REFRESH_SECRET: test_refresh_secret_at_least_32_chars_ci
          NODE_ENV: test

      - name: Run fee-service E2E tests
        run: pnpm --filter @school-erp/fee-service test:e2e
        env:
          DATABASE_URL: postgresql://school_erp:test_password@localhost:5432/school_erp_test
          REDIS_URL: redis://localhost:6379
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          JWT_ACCESS_SECRET: test_access_secret_at_least_32_chars_ci
          RAZORPAY_KEY_ID: test_key_id
          RAZORPAY_KEY_SECRET: test_key_secret_32_chars_placeholder
          NODE_ENV: test

      - name: Run student-service E2E tests
        run: pnpm --filter @school-erp/student-service test:e2e
        env:
          DATABASE_URL: postgresql://school_erp:test_password@localhost:5432/school_erp_test
          REDIS_URL: redis://localhost:6379
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          JWT_ACCESS_SECRET: test_access_secret_at_least_32_chars_ci
          NODE_ENV: test

      - name: Run payroll E2E tests
        run: pnpm --filter @school-erp/payroll-service test:e2e
        env:
          DATABASE_URL: postgresql://school_erp:test_password@localhost:5432/school_erp_test
          REDIS_URL: redis://localhost:6379
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          JWT_ACCESS_SECRET: test_jwt_access_secret_for_ci_only_32c
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_for_ci_only_32c
          NODE_ENV: test

      - name: Run biometric-bridge tests
        run: pnpm --filter @school-erp/biometric-bridge test

      - name: Run mobile tests
        run: pnpm --filter @school-erp/mobile test
        env:
          NODE_ENV: test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─── Portal E2E Tests (Playwright) ─────────────────────────────────────
  test-e2e-portals:
    name: Portal E2E Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @school-erp/admin-portal exec playwright install --with-deps chromium
      - name: Run admin-portal E2E
        run: pnpm --filter @school-erp/admin-portal e2e
        env:
          BASE_URL: http://localhost:3100
          NEXT_PUBLIC_API_URL: http://localhost:3000

  # ─── AI Service Tests (Python / pytest) ─────────────────────────────────
  test-ai:
    name: AI Service Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: school_erp_test
          POSTGRES_USER: school_erp
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://school_erp:test_password@localhost:5432/school_erp_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/ai-service/requirements.txt

      - name: Install AI service dependencies
        run: pip install -r apps/ai-service/requirements.txt pytest pytest-asyncio httpx

      - name: Run pytest
        working-directory: apps/ai-service
        run: pytest tests/ -v --tb=short
        env:
          AI_SERVICE_API_KEY: test_ai_service_key_for_ci_only

  # ─── Security Scan ──────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Run pnpm audit
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high || true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ─── Build check ────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, test-e2e-portals, test-ai]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build
